; ===========================================================================
;  Kite - configuration
; ===========================================================================
;  Drop this file next to gamemd.exe (the folder that also holds Kite.dll).
;  Every key is optional: delete the file and Kite runs with the defaults
;  shown below.
;
;  Keys are case-insensitive. Lines starting with ';' or '#' are comments.
;
;  NOTE: Kite's two features are configured in the GAME's rules file, not here.
;    rulesmd.ini  [General]  BuildCost=<int>              (uniform build cost)
;    rulesmd.ini  [<Country>] Sidebar.MixFileIndex=<int>  (per-country sidebar)
;  See README.md, section 2.
; ===========================================================================

[Kite]

; Master switch. no = load the DLL but do nothing.
Enabled=yes

; How much to write to the debug output (DebugView / Visual Studio).
; off | error | warn | info | debug
LogLevel=info

; Also append to kite.log next to gamemd.exe. Useful when the game crashes
; before you can attach a debugger; leave off for normal play.
DebugLog=no

; ---------------------------------------------------------------------------
; Feature switches go in their own sections, below.
; ---------------------------------------------------------------------------

[Features]
